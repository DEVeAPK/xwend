name: Build Xwend APK & Windows Setup

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
      - name: Initialize Android & fix compileSdk
        run: |
          cp -r lib lib_backup
          flutter create . --platforms=android --org com.xwend.app --project-name xwend
          rm -rf lib
          mv lib_backup lib
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk Xwend.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Xwend-APK
          path: Xwend.apk

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
      - name: Initialize Windows project
        run: |
          Copy-Item -Recurse -Force lib lib_backup
          flutter create . --platforms=windows --org com.xwend.app --project-name xwend
          Remove-Item -Recurse -Force lib
          Move-Item -Force lib_backup lib
        shell: pwsh
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        shell: pwsh
      - name: Create Inno Setup script
        run: |
          @"
          [Setup]
          AppName=Xwend
          AppVersion=1.0.0
          DefaultDirName={autopf}\Xwend
          DefaultGroupName=Xwend
          OutputDir=dist
          OutputBaseFilename=Xwend-Windows-Setup
          Compression=lzma
          SolidCompression=yes
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs
          [Icons]
          Name: "{group}\Xwend"; Filename: "{app}\xwend.exe"
          "@ | Out-File -FilePath installer.iss -Encoding utf8
        shell: pwsh
      - name: Build installer
        run: iscc installer.iss
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Xwend-Windows-Setup
          path: dist/Xwend-Windows-Setup.exe
