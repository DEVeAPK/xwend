<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07090E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Xwend">
  <title>Xwend — Мессенджер нового поколения</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-dark: #07090E;
      --accent: #10B981;
      --accent-2: #7C5CFF;
      --text: #F4F7FB;
      --muted: #94A0B8;
      --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04) 55%, rgba(16, 185, 129, 0.10));
      --glass-border: rgba(255, 255, 255, 0.24);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Roboto", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      color: var(--text);
      overflow: hidden;
    }

    /* Живой жидкий фон iOS 26 */
    .liquid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(135deg, #09131A 0%, #132A38 50%, #1D4154 100%);
      overflow: hidden;
    }

    .blob {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(75px);
      opacity: 0.45;
      animation: floatBlob 18s ease-in-out infinite alternate;
    }

    .blob-1 {
      top: -110px;
      left: -90px;
      background: radial-gradient(circle, var(--accent), transparent 70%);
    }

    .blob-2 {
      bottom: -120px;
      right: -90px;
      background: radial-gradient(circle, var(--accent-2), transparent 70%);
      animation-delay: -9s;
    }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(45px, 35px) scale(1.12); }
    }

    /* Стеклянный экран загрузки */
    #xwend-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #xwend-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .glass-card {
      position: relative;
      padding: 32px 36px;
      border-radius: 30px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .xwend-logo {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.25);
    }

    .xwend-logo::after {
      content: "";
      position: absolute;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulseDot 2s infinite alternate;
    }

    @keyframes pulseDot {
      0% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.15); }
    }

    .title {
      margin-top: 14px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }

    .loader-bar {
      margin-top: 22px;
      width: 140px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .loader-fill {
      width: 45%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      animation: slideLoader 1.3s ease-in-out infinite alternate;
    }

    @keyframes slideLoader {
      0% { transform: translateX(-20%); }
      100% { transform: translateX(140%); }
    }
  </style>
</head>
<body>
  <div class="liquid-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div id="xwend-splash">
    <div class="glass-card">
      <div class="xwend-logo">
        <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
          <path d="M9 9L23 23M23 9L9 23" stroke="#10B981" stroke-width="3.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="title">Xwend</div>
      <div class="subtitle">Liquid Glass iOS 26</div>
      <div class="loader-bar">
        <div class="loader-fill"></div>
      </div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('xwend-splash');
      if (splash) splash.classList.add('hidden');
    });
    setTimeout(function () {
      const splash = document.getElementById('xwend-splash');
      if (splash) splash.classList.add('hidden');
    }, 5000);
  </script>
</body>
</html>
