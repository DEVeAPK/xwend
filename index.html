<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Xwend</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Xwend","short_name":"Xwend","start_url":".","display":"standalone","background_color":"#0b0d12","theme_color":"#0b0d12"}' />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --accent:#10b981;--bg-base:#0b0d12;--bg-img:none;--text:#eef1f7;--muted:#8b93a7;
  --card:rgba(22,26,36,.72);--card-solid:#161a24;--border:rgba(255,255,255,.08);
  --blur:22px;--shadow:0 10px 30px rgba(0,0,0,.35);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --bubble-in:var(--card);--bubble-out:var(--accent);
  --header-bg:rgba(16,19,27,.65);--input-bg:rgba(24,28,38,.75);
  --gold:#fbbf24;
}
[data-mode="solid"]{--blur:0px;--card:var(--card-solid);--header-bg:var(--card-solid);--input-bg:var(--card-solid);--bubble-in:#1e2330;--border:rgba(255,255,255,.06);--shadow:0 6px 18px rgba(0,0,0,.25);}
[data-base="light"]{--bg-base:#eef1f7;--text:#10131a;--muted:#5b6478;--card:rgba(255,255,255,.72);--card-solid:#fff;--border:rgba(0,0,0,.08);--bubble-in:#fff;--header-bg:rgba(255,255,255,.7);--input-bg:rgba(255,255,255,.8);--shadow:0 10px 30px rgba(20,30,60,.12);}
[data-mode="frosted"][data-base="dark"]{--card:rgba(20,24,34,.55);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg-base);overflow:hidden;height:100vh;overscroll-behavior:none;}
#bg-anim{position:fixed;inset:-30%;z-index:-3;background:var(--bg-img),var(--bg-base);background-size:cover;transition:background .5s;}
[data-mode="liquid"] #bg-anim{animation:ls 18s ease-in-out infinite alternate;}
@keyframes ls{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1.05)}}
#bg-anim::after{content:"";position:absolute;inset:0;background:radial-gradient(40% 35% at 20% 20%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),radial-gradient(45% 40% at 85% 75%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%);pointer-events:none;}
button,input,textarea{font:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
::-webkit-scrollbar{width:0;height:0;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-t);}
.glass{background:var(--card);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border);box-shadow:var(--shadow);}
header.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--header-bg);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--border);z-index:20;}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;}
.spacer{flex:1;}
.stars-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:20px;background:linear-gradient(135deg,rgba(251,191,36,.25),rgba(245,158,11,.15));border:1px solid rgba(251,191,36,.4);font-size:12.5px;font-weight:700;color:var(--gold);}
#screens{position:relative;flex:1;overflow:hidden;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.2,.8,.2,1);background:transparent;}
.screen.slide-left{transform:translateX(-100%);}
.screen.slide-right{transform:translateX(100%);}
.screen.active{transform:translateX(0);}
.tab{display:flex;flex-direction:column;flex:1;min-height:0;padding-bottom:calc(72px + var(--safe-b));}
.tab-pane{flex:1;overflow-y:auto;padding:8px 12px;}
.chat-item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;margin-bottom:6px;user-select:none;-webkit-user-select:none;touch-action:pan-y;}
.chat-item:active{background:rgba(16,185,129,.1);}
.avatar{width:48px;height:48px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;background-size:cover;background-position:center;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar.sm{width:36px;height:36px;font-size:14px;}
.avatar.lg{width:84px;height:84px;font-size:30px;}
.chat-meta{flex:1;min-width:0;}
.chat-name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.chat-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.unread{min-width:20px;height:20px;border-radius:10px;padding:0 6px;font-size:11px;font-weight:700;display:grid;place-items:center;color:#fff;background:var(--accent);}
.badge-type{font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(16,185,129,.2);font-weight:700;}
.messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth;}
.msg-group{display:flex;flex-direction:column;max-width:82%;}
.msg-group.out{align-self:flex-end;align-items:flex-end;}
.msg-group.in{align-self:flex-start;align-items:flex-start;}
.bubble{position:relative;padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.4;word-wrap:break-word;background:var(--bubble-in);border:1px solid var(--border);box-shadow:var(--shadow);}
.msg-group.out .bubble{background:var(--bubble-out);color:#fff;border-color:transparent;}
.msg-group.pending .bubble{opacity:.7;}
.msg-meta{font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:4px;}
.msg-group.out .msg-meta{color:rgba(255,255,255,.7);}
.composer{padding:8px 10px calc(8px + var(--safe-b));display:flex;align-items:flex-end;gap:8px;background:var(--header-bg);border-top:1px solid var(--border);}
.composer .field{flex:1;display:flex;align-items:center;padding:6px 12px;border-radius:20px;background:var(--input-bg);border:1px solid var(--border);}
.composer textarea{flex:1;background:transparent;border:none;outline:none;resize:none;max-height:110px;font-size:15px;padding:6px 0;}
.cbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);}
.send-btn{background:var(--accent);color:#fff;}
.send-btn:disabled{opacity:.4;}
nav.bottom{position:absolute;left:10px;right:10px;bottom:calc(8px + var(--safe-b));z-index:25;display:flex;justify-content:space-around;padding:8px;border-radius:22px;background:var(--card);border:1px solid var(--border);}
nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:11px;}
nav.bottom button.on{color:var(--accent);}
.modal-backdrop{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;pointer-events:none;}
.modal-backdrop.open{display:flex;pointer-events:auto;}
.modal{width:100%;max-width:520px;background:var(--card-solid);border-radius:24px 24px 0 0;padding:20px;max-height:85vh;overflow-y:auto;animation:up .3s;}
@keyframes up{from{transform:translateY(100%)}}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(30,34,44,.95);color:#fff;padding:10px 18px;border-radius:14px;z-index:200;opacity:0;transition:.3s;pointer-events:none;}
#toast.show{opacity:1;}
.avatar-edit{position:relative;display:inline-block;cursor:pointer;}
.avatar-edit .cam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;border:2px solid var(--card-solid);}
#ctxOverlay{position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.35);display:none;align-items:flex-end;pointer-events:none;}
#ctxOverlay.open{display:flex;pointer-events:auto;}
#ctxSheet{width:100%;max-width:520px;background:var(--card-solid);border-radius:24px 24px 0 0;padding:16px;animation:up .2s;}
#ctxSheet button.ctx-btn{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;font-weight:600;}
#ctxSheet button.ctx-btn.danger{color:#ff5c6c;}
.ptabs{display:flex;gap:6px;padding:4px;background:rgba(255,255,255,.05);border-radius:12px;margin:8px 12px;}
.ptabs button{flex:1;padding:10px;border-radius:9px;font-weight:600;color:var(--muted);}
.ptabs button.on{background:var(--accent);color:#fff;}
.opt-card{margin:0 12px 10px;border-radius:18px;background:var(--card);border:1px solid var(--border);overflow:hidden;}
.opt-row{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid var(--border);font-size:14px;}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px;}
.seg button{padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted);}
.seg button.on{background:var(--accent);color:#fff;}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:10px;}
.swatch{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2);}
.swatch.on{box-shadow:inset 0 0 0 3px #fff;}
.gifts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.gift-item{padding:14px;border-radius:16px;text-align:center;background:var(--card);border:1px solid var(--border);}
.gift-item.selected{border-color:var(--gold);}
</style>
</head>
<body data-mode="liquid" data-base="dark">
<div id="bg-anim"></div>

<div id="authScreen" style="position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#0b0d12,#10131c);padding:24px;">
  <h1>Xwend</h1>
  <div class="auth-card" style="width:100%;max-width:400px;background:rgba(255,255,255,.05);padding:22px;border-radius:22px;">
    <div style="display:flex;margin-bottom:16px;">
      <button id="tabLogin" style="flex:1;padding:10px;color:var(--accent);font-weight:bold;">Вход</button>
      <button id="tabRegister" style="flex:1;padding:10px;color:#8b93a7;">Регистрация</button>
    </div>
    <input id="authEmail" type="email" placeholder="Email" style="width:100%;padding:12px;margin-bottom:10px;border-radius:12px;border:none;background:rgba(255,255,255,.06);color:#fff;"/>
    <input id="authPassword" type="password" placeholder="Пароль" style="width:100%;padding:12px;margin-bottom:10px;border-radius:12px;border:none;background:rgba(255,255,255,.06);color:#fff;"/>
    <div id="nameField" style="display:none;"><input id="authName" type="text" placeholder="Имя" style="width:100%;padding:12px;margin-bottom:10px;border-radius:12px;border:none;background:rgba(255,255,255,.06);color:#fff;"/></div>
    <div id="usernameField" style="display:none;"><input id="authUsername" type="text" placeholder="@username" style="width:100%;padding:12px;margin-bottom:10px;border-radius:12px;border:none;background:rgba(255,255,255,.06);color:#fff;"/></div>
    <div id="authMsg" style="color:#ff8791;font-size:12px;text-align:center;margin-bottom:10px;"></div>
    <button id="authSubmit" style="width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-weight:bold;">Войти</button>
  </div>
</div>

<div id="app" style="display:none;">
  <div id="screens">
    <div id="mainScreen" class="screen active">
      <header class="topbar">
        <div class="logo">Xwend <span style="width:8px;height:8px;border-radius:50%;background:var(--accent);"></span></div>
        <div class="spacer"></div>
        <button class="stars-badge" id="topBalance">⭐ <span id="topBalanceVal">0</span></button>
        <button id="btnNewChat" style="font-size:24px;color:var(--text);">+</button>
      </header>

      <div id="tabChats" class="tab"><div class="tab-pane" id="chatListPane"></div></div>
      <div id="tabSearch" class="tab" style="display:none">
        <div style="padding:12px;"><input id="searchInput" placeholder="Поиск людей..." style="width:100%;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--border);color:var(--text);"/></div>
        <div class="tab-pane" id="searchResults"></div>
      </div>
      <div id="tabProfile" class="tab" style="display:none">
        <div class="tab-pane">
          <div style="text-align:center;padding:20px;">
            <div class="avatar-edit" id="avatarEdit">
              <div class="avatar lg" id="profileAvatar" style="margin:0 auto;background:var(--accent);">?</div>
              <div class="cam">📷</div>
            </div>
            <h2 id="profileName" style="margin:12px 0 4px;">—</h2>
            <div id="profileUsername" style="color:var(--accent);">@—</div>
            <div id="profileBio" style="color:var(--muted);margin-top:8px;">—</div>
            <div style="margin-top:16px;display:flex;justify-content:center;gap:8px;">
              <span class="stars-badge">⭐ <span id="myBalanceVal">0</span></span>
              <button id="btnTopUp" style="background:var(--card);padding:5px 10px;border-radius:20px;border:1px solid var(--border);color:var(--text);">Пополнить</button>
            </div>
            <button id="btnGiftSelf" style="width:100%;padding:12px;border-radius:12px;background:var(--gold);color:#000;font-weight:bold;margin-top:16px;">🎁 Подарить себе ★</button>
          </div>
          <div class="ptabs" id="profileTabs">
            <button data-pt="settings" class="on">Настройки</button>
            <button data-pt="gifts">Подарки</button>
          </div>
          <div id="ptSettings">
            <div class="opt-card">
              <div class="opt-row"><span>Стиль</span>
                <div class="seg" id="modeSeg"><button data-mode="liquid" class="on">Жидкое</button><button data-mode="frosted">Матовое</button><button data-mode="solid">Плоский</button></div>
              </div>
              <div class="opt-row"><span>База</span>
                <div class="seg" id="baseSeg"><button data-base="dark" class="on">Тёмная</button><button data-base="light">Светлая</button></div>
              </div>
            </div>
            <div style="padding:12px;"><div class="swatches" id="accentSwatches"></div></div>
            <button id="btnLogout" style="width:calc(100% - 24px);margin:10px 12px;padding:12px;border-radius:12px;background:rgba(255,92,108,.2);color:#ff5c6c;font-weight:bold;">Выйти</button>
          </div>
          <div id="ptGifts" style="display:none">
            <div class="gifts-grid" id="myGiftsGrid" style="padding:12px;"></div>
          </div>
        </div>
      </div>

      <nav class="bottom" id="bottomNav">
        <button data-tab="chats" class="on">Чаты</button>
        <button data-tab="search">Поиск</button>
        <button data-tab="profile">Профиль</button>
      </nav>
    </div>
    <div id="chatScreen" class="screen slide-right">
      <div class="chat-header" style="display:flex;align-items:center;padding:10px 14px;background:var(--header-bg);border-bottom:1px solid var(--border);">
        <button id="btnBackChat" style="font-size:20px;margin-right:12px;">←</button>
        <div class="avatar sm" id="chatAvatar">?</div>
        <div style="flex:1;margin-left:12px;">
          <div id="chatName" style="font-weight:bold;">—</div>
          <div id="chatUsername" style="font-size:12px;color:var(--muted);">@—</div>
        </div>
      </div>
      <div class="messages" id="messagesPane"></div>
      <div class="composer">
        <button class="cbtn" id="btnAttach">📎</button>
        <div class="field">
          <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
        </div>
        <button class="cbtn send-btn" id="btnSend" disabled>➤</button>
      </div>
      <input type="file" id="fileInput" style="display:none" multiple />
    </div>
  </div>
</div>

<div id="ctxOverlay"><div id="ctxSheet"><div id="ctxHead"></div><div id="ctxItems"></div></div></div>

<div class="modal-backdrop" id="giftShopModal">
  <div class="modal">
    <button class="close-x" onclick="closeModal('giftShopModal')">✕</button>
    <h3 id="giftShopTitle">Подарок</h3>
    <div class="gifts-grid" id="giftsGrid"></div>
    <button class="btn-primary" id="btnSendGift" style="margin-top:16px;width:100%;padding:14px;background:var(--accent);color:#fff;border-radius:12px;" disabled>Отправить</button>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://mdggylqccbgzciirnizs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_z3kEFV2D8pXZzKxP4QMUsw_thDkdBF7';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true } });

const state = {
  user: null, profile: null, chats: [],
  currentChat: null, messages: [], realtimeChannel: null,
  sending: false, savedId: null, selectedGift: null, giftTarget: null
};

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function toast(m) {
  const t = $('#toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}
function initials(n) {
  if (!n) return '?';
  return n.trim().split(/\s+/).slice(0, 2).map(p => p[0] ? p[0].toUpperCase() : '').join('');
}
function colorFor(seed) {
  const s = String(seed || 'x'); let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  const p = ['#7c5cff', '#10b981', '#3b82f6', '#ff6b6b', '#f59e0b', '#ec4899', '#06b6d4', '#8b5cf6'];
  return p[h % p.length];
}
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso), n = new Date();
  if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
}
function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtStars(n) { return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

function applyTheme(theme) {
  const mode = theme.mode || 'liquid';
  const base = theme.base || 'dark';
  const accent = theme.accent || '#10b981';
  document.body.dataset.mode = mode;
  document.body.dataset.base = base;
  document.documentElement.style.setProperty('--accent', accent);
  localStorage.setItem('xwend_theme', JSON.stringify({ mode, base, accent }));
  $$('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  $$('#baseSeg button').forEach(b => b.classList.toggle('on', b.dataset.base === base));
  $$('#accentSwatches .swatch').forEach(b => b.classList.toggle('on', b.dataset.color === accent));
}
window.applyTheme = applyTheme;

// AUTH
let authMode = 'login';
$('#tabLogin').onclick = () => switchAuth('login');
$('#tabRegister').onclick = () => switchAuth('register');
function switchAuth(m) {
  authMode = m;
  $('#tabLogin').style.color = m === 'login' ? 'var(--accent)' : 'var(--muted)';
  $('#tabRegister').style.color = m === 'register' ? 'var(--accent)' : 'var(--muted)';
  $('#nameField').style.display = m === 'register' ? 'block' : 'none';
  $('#usernameField').style.display = m === 'register' ? 'block' : 'none';
  $('#authSubmit').textContent = m === 'login' ? 'Войти' : 'Создать аккаунт';
}

$('#authSubmit').onclick = async () => {
  const email = $('#authEmail').value.trim();
  const pass = $('#authPassword').value;
  const name = $('#authName').value.trim();
  const uname = $('#authUsername').value.trim().replace(/^@+/, '').toLowerCase();
  if (!email || pass.length < 6) return toast('Проверьте данные');
  $('#authSubmit').disabled = true;
  try {
    if (authMode === 'login') {
      await sb.auth.signInWithPassword({ email, password: pass });
    } else {
      const res = await sb.auth.signUp({ email, password: pass, options: { data: { name, username: uname } } });
      if (res.user) {
        await sb.from('profiles').upsert({ id: res.user.id, name, username: uname, stars: 0, avatar_color: colorFor(uname) }, { onConflict: 'id' });
      }
    }
  } catch (e) { toast(e.message); } finally { $('#authSubmit').disabled = false; }
};

async function initApp(session) {
  state.user = session.user;
  $('#authScreen').style.display = 'none';
  $('#app').style.display = 'flex';

  const p = await sb.from('profiles').select('*').eq('id', state.user.id).single();
  state.profile = p.data;
  if (state.profile) {
    $('#profileName').textContent = state.profile.name || 'Без имени';
    $('#profileUsername').textContent = '@' + (state.profile.username || '—');
    $('#profileAvatar').innerHTML = state.profile.avatar_url ? `<img src="${state.profile.avatar_url}"/>` : initials(state.profile.name || state.profile.username);
    if (!state.profile.avatar_url) $('#profileAvatar').style.background = state.profile.avatar_color || 'var(--accent)';
    $('#myBalanceVal').textContent = fmtStars(state.profile.stars);
    $('#topBalanceVal').textContent = fmtStars(state.profile.stars);
    if (state.profile.theme) applyTheme(state.profile.theme);
  }

  try { const r = await sb.rpc('get_or_create_saved_chat'); state.savedId = r.data; } catch (e) {}
  await loadChats();
  await loadGiftsCatalog();
  subscribeRealtime();
}

sb.auth.onAuthStateChange((e, session) => {
  if (session) initApp(session);
  else { $('#authScreen').style.display = 'flex'; $('#app').style.display = 'none'; }
});

// CHATS
async function loadChats() {
  const { data: parts } = await sb.from('chat_participants').select('chat_id, role').eq('user_id', state.user.id);
  if (!parts || !parts.length) return renderChats([], null);
  const ids = parts.map(p => p.chat_id);
  const [chatsRes, allPartsRes, lastMsgsRes] = await Promise.all([
    sb.from('chats').select('*').in('id', ids),
    sb.from('chat_participants').select('chat_id, user_id, profiles:user_id(id, username, name, avatar_color, avatar_url)').in('chat_id', ids),
    sb.from('messages').select('*').in('chat_id', ids).order('created_at', { ascending: false })
  ]);
  const lastBy = {}; (lastMsgsRes.data || []).forEach(m => { if (!lastBy[m.chat_id]) lastBy[m.chat_id] = m; });
  const chats = (chatsRes.data || []).map(c => {
    const others = (allPartsRes.data || []).filter(p => p.chat_id === c.id && p.user_id !== state.user.id);
    return { ...c, other: others[0]?.profiles || null, last: lastBy[c.id], my_role: parts.find(p => p.chat_id === c.id)?.role || 'member' };
  });
  const savedChat = chats.find(c => c.type === 'saved') || { id: state.savedId, type: 'saved', title: 'Избранное' };
  const otherChats = chats.filter(c => c.type !== 'saved').sort((a, b) => {
    const ta = a.last?.created_at ? new Date(a.last.created_at).getTime() : 0;
    const tb = b.last?.created_at ? new Date(b.last.created_at).getTime() : 0;
    return tb - ta;
  });
  state.chats = chats;
  renderChats(otherChats, savedChat);
}

function renderChats(chats, savedChat) {
  const pane = $('#chatListPane'); pane.innerHTML = '';
  if (savedChat) {
    const el = document.createElement('div'); el.className = 'chat-item';
    el.innerHTML = `<div class="avatar" style="background:linear-gradient(135deg,var(--accent),#7c5cff);">🔖</div><div class="chat-meta"><div class="chat-name">Избранное</div><div class="chat-preview">Заметки и файлы</div></div>`;
    el.onclick = () => openChat({ id: state.savedId, type: 'saved', title: 'Избранное', my_role: 'owner' });
    pane.appendChild(el);
  }
  chats.forEach(c => {
    const name = c.type === 'direct' ? (c.other?.name || 'Пользователь') : c.title;
    const el = document.createElement('div'); el.className = 'chat-item';
    el.innerHTML = `
      <div class="avatar" style="background:${c.other?.avatar_color || 'var(--accent)'}">${c.other?.avatar_url ? `<img src="${c.other.avatar_url}"/>` : initials(name)}</div>
      <div class="chat-meta"><div class="chat-name">${name}</div><div class="chat-preview">${c.last ? (c.last.content || 'Файл') : 'Нет сообщений'}</div></div>`;
    el.onclick = () => openChat(c);
    pane.appendChild(el);
  });
}

async function openChat(c) {
  state.currentChat = c;
  $('#chatName').textContent = c.title || (c.other?.name) || 'Чат';
  $('#mainScreen').classList.remove('active'); $('#mainScreen').classList.add('slide-left');
  $('#chatScreen').classList.remove('slide-right'); $('#chatScreen').classList.add('active');
  const { data } = await sb.from('messages').select('*').eq('chat_id', c.id).order('created_at', { ascending: true });
  state.messages = data || [];
  renderMessages();
}

$('#btnBackChat').onclick = () => {
  $('#chatScreen').classList.remove('active'); $('#chatScreen').classList.add('slide-right');
  $('#mainScreen').classList.remove('slide-left'); $('#mainScreen').classList.add('active');
  state.currentChat = null; loadChats();
};

function renderMessages() {
  const pane = $('#messagesPane'); pane.innerHTML = '';
  state.messages.forEach(m => {
    const out = m.sender_id === state.user.id;
    const el = document.createElement('div');
    el.className = `msg-group ${out ? 'out' : 'in'} ${String(m.id).startsWith('tmp_') ? 'pending' : ''}`;
    el.innerHTML = `<div class="bubble">${escapeHtml(m.content || (m.message_type === 'image' ? '📷 Фото' : 'Файл'))}</div><div class="msg-meta">${fmtTime(m.created_at)}</div>`;
    if (out && !String(m.id).startsWith('tmp_')) {
      let timer;
      el.addEventListener('pointerdown', () => { timer = setTimeout(() => { if (confirm('Удалить?')) deleteMessage(m); }, 500); });
      el.addEventListener('pointerup', () => clearTimeout(timer));
      el.addEventListener('pointermove', () => clearTimeout(timer));
    }
    pane.appendChild(el);
  });
  pane.scrollTop = pane.scrollHeight;
}

// SEND
const inputEl = $('#msgInput');
inputEl.addEventListener('input', () => { $('#btnSend').disabled = !inputEl.value.trim() || !state.currentChat; });
$('#btnSend').onclick = async () => {
  if (state.sending || !state.currentChat) return;
  const text = inputEl.value.trim(); if (!text) return;
  state.sending = true; inputEl.value = ''; $('#btnSend').disabled = true;
  const tmpId = 'tmp_' + Date.now();
  state.messages.push({ id: tmpId, chat_id: state.currentChat.id, sender_id: state.user.id, content: text, created_at: new Date().toISOString() });
  renderMessages();
  try {
    const { data, error } = await sb.from('messages').insert({ chat_id: state.currentChat.id, sender_id: state.user.id, content: text, message_type: 'text' }).select().single();
    if (error) throw error;
    const idx = state.messages.findIndex(m => m.id === tmpId);
    if (idx >= 0) state.messages[idx] = data;
    renderMessages();
  } catch (e) {
    toast('Ошибка отправки'); state.messages = state.messages.filter(m => m.id !== tmpId); renderMessages();
  } finally { state.sending = false; $('#btnSend').disabled = !inputEl.value.trim(); }
};

// DELETE
async function deleteMessage(m) {
  state.messages = state.messages.filter(x => x.id !== m.id);
  renderMessages();
  await sb.from('messages').delete().eq('id', m.id);
}
  // REALTIME
function subscribeRealtime() {
  if (state.realtimeChannel) sb.removeChannel(state.realtimeChannel);
  state.realtimeChannel = sb.channel('global')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const m = payload.new;
      if (state.currentChat && m.chat_id === state.currentChat.id) {
        if (!state.messages.some(x => x.id === m.id)) { state.messages.push(m); renderMessages(); }
      }
      loadChats();
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, payload => {
      const m = payload.old;
      if (state.currentChat && m.chat_id === state.currentChat.id) {
        state.messages = state.messages.filter(x => x.id !== m.id); renderMessages();
      }
    })
    .subscribe();
}

// FILE UPLOAD
$('#btnAttach').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = async (e) => {
  const file = e.target.files[0]; if (!file || !state.currentChat) return;
  e.target.value = '';
  const isImg = file.type.startsWith('image/');
  const tmpId = 'tmp_' + Date.now();
  state.messages.push({ id: tmpId, chat_id: state.currentChat.id, sender_id: state.user.id, content: '', message_type: isImg ? 'image' : 'file', created_at: new Date().toISOString() });
  renderMessages();
  try {
    const path = `${state.user.id}/${Date.now()}_${file.name}`;
    await sb.storage.from('xwend-media').upload(path, file);
    const { data: pub } = sb.storage.from('xwend-media').getPublicUrl(path);
    const { data, error } = await sb.from('messages').insert({
      chat_id: state.currentChat.id, sender_id: state.user.id, content: '', message_type: isImg ? 'image' : 'file', file_url: pub.publicUrl, file_name: file.name
    }).select().single();
    if (error) throw error;
    const idx = state.messages.findIndex(m => m.id === tmpId);
    if (idx >= 0) state.messages[idx] = data;
    renderMessages();
  } catch (err) { toast('Ошибка файла'); state.messages = state.messages.filter(m => m.id !== tmpId); renderMessages(); }
};

// SEARCH
let searchTimeout;
$('#searchInput').oninput = (e) => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(async () => {
    const q = e.target.value.trim();
    const resPane = $('#searchResults');
    if (!q) return resPane.innerHTML = '';
    const { data } = await sb.rpc('global_search', { p_query: q });
    resPane.innerHTML = '';
    (data || []).forEach(r => {
      const el = document.createElement('div'); el.className = 'chat-item';
      el.innerHTML = `<div class="avatar" style="background:${colorFor(r.username)}">${r.avatar_url ? `<img src="${r.avatar_url}"/>` : initials(r.name)}</div><div class="chat-meta"><div class="chat-name">${escapeHtml(r.name)}</div><div class="chat-preview">@${escapeHtml(r.username)}</div></div>`;
      el.onclick = async () => {
        if (r.kind === 'user') {
          const { data: d } = await sb.rpc('get_or_create_direct_chat', { other_user_id: r.id });
          loadChats().then(() => { const c = state.chats.find(x => x.id === d); if (c) openChat(c); });
        } else {
          await sb.rpc('join_public_chat', { p_chat_id: r.id });
          toast('Вступили'); loadChats();
        }
      };
      resPane.appendChild(el);
    });
  }, 300);
};

// THEME
function buildThemeUI() {
  const a = $('#accentSwatches'); a.innerHTML = '';
  ['#10b981', '#7c5cff', '#3b82f6', '#ff6b6b', '#f59e0b'].forEach(c => {
    const b = document.createElement('button'); b.className = 'swatch'; b.style.background = c; b.dataset.color = c;
    b.onclick = () => { applyTheme({ mode: document.body.dataset.mode, base: document.body.dataset.base, accent: c }); };
    a.appendChild(b);
  });
  $$('#modeSeg button').forEach(b => b.onclick = () => applyTheme({ mode: b.dataset.mode, base: document.body.dataset.base, accent: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() }));
  $$('#baseSeg button').forEach(b => b.onclick = () => applyTheme({ mode: document.body.dataset.mode, base: b.dataset.base, accent: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() }));
}
buildThemeUI();
const savedTheme = localStorage.getItem('xwend_theme');
if (savedTheme) applyTheme(JSON.parse(savedTheme));

// GIFTS
async function loadGiftsCatalog() {
  const { data } = await sb.from('gifts').select('*').order('sort_order');
  if (data) {
    const grid = $('#giftsGrid'); grid.innerHTML = '';
    data.forEach(g => {
      const el = document.createElement('div'); el.className = 'gift-item';
      el.innerHTML = `<div style="font-size:36px;">${g.emoji}</div><div style="font-weight:bold;">${g.title}</div><div style="color:var(--gold);">${fmtStars(g.price)} ★</div>`;
      el.onclick = () => {
        $$('.gift-item').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        state.selectedGift = g; $('#btnSendGift').disabled = false;
      };
      grid.appendChild(el);
    });
  }
}

$('#btnGiftSelf').onclick = () => {
  state.giftTarget = { recipientId: state.user.id, chatId: null };
  $('#giftShopTitle').textContent = 'Подарить себе ★';
  openModal('giftShopModal');
};

$('#btnSendGift').onclick = async () => {
  if (!state.selectedGift || !state.giftTarget) return;
  try {
    await sb.rpc('send_gift', { p_recipient: state.giftTarget.recipientId, p_gift_code: state.selectedGift.code, p_note: '', p_chat_id: state.giftTarget.chatId });
    closeModal('giftShopModal'); toast('Подарок отправлен');
    const { data } = await sb.from('profiles').select('stars').eq('id', state.user.id).single();
    state.profile.stars = data.stars;
    $('#myBalanceVal').textContent = fmtStars(data.stars);
    $('#topBalanceVal').textContent = fmtStars(data.stars);
  } catch (e) { toast(e.message); }
};

// MODALS
function openModal(id) { $('#' + id).classList.add('open'); }
function closeModal(id) { $('#' + id).classList.remove('open'); }
window.closeModal = closeModal;

// PROFILE TABS
$$('#profileTabs button').forEach(b => b.onclick = () => {
  $$('#profileTabs button').forEach(x => x.classList.remove('on')); b.classList.add('on');
  $('#ptSettings').style.display = b.dataset.pt === 'settings' ? 'block' : 'none';
  $('#ptGifts').style.display = b.dataset.pt === 'gifts' ? 'block' : 'none';
});

// BOTTOM NAV
$$('#bottomNav button').forEach(b => b.onclick = () => {
  $$('#bottomNav button').forEach(x => x.classList.remove('on')); b.classList.add('on');
  const tab = b.dataset.tab;
  $('#tabChats').style.display = tab === 'chats' ? 'flex' : 'none';
  $('#tabSearch').style.display = tab === 'search' ? 'flex' : 'none';
  $('#tabProfile').style.display = tab === 'profile' ? 'flex' : 'none';
  if (tab === 'chats') loadChats();
});

$('#btnLogout').onclick = () => sb.auth.signOut();

sb.auth.getSession().then(({ data: { session } }) => { if (session) initApp(session); });
</script>
