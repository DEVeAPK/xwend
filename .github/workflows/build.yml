name: Build Xwend APK & Windows Setup

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter create . --platforms=android,windows
      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk Xwend.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Xwend-APK
          path: Xwend.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter create . --platforms=android,windows
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        shell: pwsh
      - name: Create Inno Setup script
        run: |
          @"
          [Setup]
          AppName=Xwend
          AppVersion=1.0.0
          DefaultDirName={autopf}\Xwend
          DefaultGroupName=Xwend
          OutputDir=dist
          OutputBaseFilename=Xwend-Windows-Setup
          Compression=lzma
          SolidCompression=yes
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs
          [Icons]
          Name: "{group}\Xwend"; Filename: "{app}\xwend.exe"
          "@ | Out-File -FilePath installer.iss -Encoding utf8
        shell: pwsh
      - name: Build installer
        run: iscc installer.iss
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Xwend-Windows-Setup
          path: dist/Xwend-Windows-Setup.exe
